<!DOCTYPE html>
<html>
  <head>
    <title>Agendar una cita - Immunosite</title>
  </head>
  <body>
    <h1>Agenda tu cita</h1>
    <h2>Llena el siguiente formulario para agendar una cita</h2>
    <form>
      <input type="text" name="Nombres" required minlenght="3" placeholder="Escribe tu nombre">
      <input type="text" name="Apellidos" required placeholder="Escribe tus apellidos">
      <input type="number" name="Telefono" minlength="9" maxlenght="9" required placeholder="Escribe tu numero de telefono">
      <input type="date" name="Fecha de nacimiento" required placeholder="Tu fecha de nacimiento">
      <input type="email" name="Correo" required placeholder="Tu correo">
      <input type="text" name="Motivo de consulta" placeholder="Escribe tu motivo de consulta">
      <input type="submit" value="Enviar">
    </form>
  </body>
</html>
