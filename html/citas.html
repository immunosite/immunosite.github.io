<!DOCTYPE html>
<html>
  <head>
    <title>Agendar una cita - Immunosite</title>
    <link rel="stylesheet" href="../css/styles.css">
  </head>
  <body>
    <a href="../index.html">Inicio</a>
    <h1>Agenda tu cita</h1>
    <h2>Llena el siguiente formulario para agendar una cita</h2>
    <form>
      <label for="nombre">Nombres completos:</label>
      <input type="text" id="nombre" name="Nombres" required minlenght="3" placeholder="Escribe tu nombre">
      <label for="apellido">Apellidos completos:</label>
      <input type="text" id="apellido" name="Apellidos" required placeholder="Escribe tus apellidos">
      <label for="telefono">Telefono:</label>
      <input type="number" id="telefono" name="Telefono" minlength="9" maxlenght="9" required placeholder="Escribe tu numero de telefono">
      <label for="origin">Provincia de origen:</label>
      <select id="origin" name="Lugar de origen" placeholder="Escoja su provincia">
        <option value="Lima Metropolitana">Lima Metropolitana</option>
        <option value="Amazonas">Amazonas</option>
        <option value="Ancash">Ancash</option>
        <option value="Apurimac">Apurimac</option>
        <option value="Arequipa">Arequipa</option>
        <option value="Ayacucho">Ayacucho</option>
        <option value="Cajamarca">Cajamarca</option>
        <option value="Callao">Callao</option>
        <option value="Cusco">Cusco</option>
        <option value="Huancavelica">Huancavelica</option>
        <option value="Huanuco">Huanuco</option>
        <option value="Ica">Ica</option>
        <option value="Junin">Junin</option>
        <option value="La Libertad">La Libertad</option>
        <option value="Lambayeque">Lambayeque</option>
        <option value="Lima provincias">Lima Provincias</option>
        <option value="Loreto">Loreto</option>
        <option value="Madre de Dios">Madre de Dios</option>
        <option value="Moquegua">Moquegua</option>
        <option value="Pasco">Pasco</option>
        <option value="Piura">Piura</option>
        <option value="Puno">Puno</option>
        <option value="San Martin">San Martin</option>
        <option value="Tacna">Tacna</option>
        <option value="Tumbes">Tumbes</option>
        <option value="Ucayali">Ucayali</option>
      </select>
      <label for="fnac">Escriba su fecha de nacimiento:</label>
      <input type="date" id="fnac" name="Fecha de nacimiento" required>
      <label for="email">Ingrese su correo electronico:</label>
      <input type="email" id="email" name="Correo" required placeholder="Tu correo">
      <label for="mtcons">Escriba brevemente el motivo de su consulta:</label>
      <input type="text" name="Motivo de consulta" placeholder="Escribe el motivo de consulta">
      <input type="submit" value="Enviar" onclick=>
    </form>
  </body>
</html>
